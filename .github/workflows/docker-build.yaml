name: Docker Build

on:
  push:
  release:
    types: [published, prereleased]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    strategy:
      matrix:
        include:
          - arch: linux/amd64
            hass_arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Cache Docker layers
        uses: actions/cache@v3.3.1
        continue-on-error: true
        with:
          path: /tmp/.buildx-cache
          key: ${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.arch }}-

      # label version as branch-run_number
      - name: Build Branch
        if: ${{ startsWith(github.ref, 'refs/heads/') }}
        run: |
          set -x
          docker build \
            --build-arg HASS_ARCH=${{ matrix.hass_arch }} \
            --build-arg BUILD_VERSION=${GITHUB_REF##*/}-${{ github.run_number }} \
            --tag ci:${{ github.run_number }} \
            --platform ${{ matrix.arch }} \
            --progress plain \
            --file ./docker/Dockerfile \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            .

      # label version as tag
      - name: Build Tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -x
          docker build \
            --build-arg HASS_ARCH=${{ matrix.hass_arch }} \
            --build-arg BUILD_VERSION=${GITHUB_REF##*/} \
            --tag ci:${{ github.run_number }} \
            --platform ${{ matrix.arch }} \
            --progress plain \
            --file ./docker/Dockerfile \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            .

      # Temp fix
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Inspect
        run: |
          set -x
          docker image inspect ci:${{ github.run_number }}
          docker history --no-trunc ci:${{ github.run_number }}

      - name: Save tarball
        run: |
          set -x
          docker save --output ci-${{ matrix.hass_arch }}-${{ github.run_number }}.tar.gz ci:${{ github.run_number }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ci-${{ matrix.hass_arch }}-${{ github.run_number }}
          path: ci-${{ matrix.hass_arch }}-${{ github.run_number }}.tar.gz

  publish:
    needs: build
    name: Publish Image
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/pull/') && !startsWith(github.ref, 'refs/heads/dependabot/') }}
    permissions:
      packages: write
    strategy:
      matrix:
        arch: [amd64]
        registry:
          - {
              url: ghcr.io,
              repo: "ghcr.io/${{ github.repository }}",
            }
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download container artifact
        uses: actions/download-artifact@v3
        with:
          name: ci-${{ matrix.arch }}-${{ github.run_number }}

      - name: Import image
        run: |
          docker load --input ci-${{ matrix.arch }}-${{ github.run_number }}.tar.gz

      - name: Docker login
        run: |
          docker login ${{ matrix.registry.url }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        # if: ${{ startsWith(github.ref, 'refs/tags/') }}
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          docker/publish.py \
            --tag ${GITHUB_REF##*/} \
            --repo ${{ matrix.registry.repo }} \
            --image \
            --ci \
            --arch ${{ matrix.arch }} \
            --image-name ci:${{ github.run_number }} \
            --latest

      - name: Push image
        # if: ${{ startsWith(github.ref, 'refs/tags/') }}
        if: ${{ github.ref != 'refs/heads/master' }}
        run: |
          docker/publish.py \
            --tag ${GITHUB_REF##*/} \
            --repo ${{ matrix.registry.repo }} \
            --image \
            --ci \
            --arch ${{ matrix.arch }} \
            --image-name ci:${{ github.run_number }}

  create_manifest:
    needs: publish
    name: Create Manifest
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        registry:
          - {
              url: ghcr.io,
              repo: "ghcr.io/${{ github.repository }}",
            }
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Enable Experimental Docker Features
        run: |
          export DOCKER_CLI_EXPERIMENTAL="enabled"
          echo "DOCKER_CLI_EXPERIMENTAL=${DOCKER_CLI_EXPERIMENTAL}" >> $GITHUB_ENV

      - name: Docker login
        run: |
          docker login ${{ matrix.registry.url }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Create Manifest
        # if: ${{ startsWith(github.ref, 'refs/tags/') }}
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          docker/publish.py \
            --tag ${GITHUB_REF##*/} \
            --repo ${{ matrix.registry.repo }} \
            --manifest \
            --ci \
            --latest

      - name: Create Manifest
        # if: ${{ startsWith(github.ref, 'refs/tags/') }}
        if: ${{ github.ref != 'refs/heads/master' }}
        run: |
          docker/publish.py \
            --tag ${GITHUB_REF##*/} \
            --repo ${{ matrix.registry.repo }} \
            --manifest \
            --ci
